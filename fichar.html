<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OSYC · Fichaje</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2c6eb4" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/brand.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body { min-height: 100vh; min-height: 100dvh; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
    .logo { text-align: center; margin: 8px 0 22px; }
    .logo img { height: 74px; margin: 0 auto; display: block; }
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(14px); border-radius: 18px; padding: 24px 20px; box-shadow: 0 8px 30px rgba(44, 74, 110, .08); }
    .lbl { font-size: 11px; font-weight: 700; color: #8a7052; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .inp { min-height: 50px; font-size: 16px !important; }
    .fichar-btn {
      width: 100%; min-height: 96px; border: none; border-radius: 22px; cursor: pointer;
      background: linear-gradient(135deg, #2c6eb4, #5a97d4); color: #fff;
      font-family: var(--font-title); font-size: 22px; font-weight: 800; letter-spacing: .02em;
      box-shadow: 0 10px 30px rgba(44, 110, 180, .32); transition: transform .12s, box-shadow .2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .fichar-btn:active { transform: scale(.97); }
    .fichar-btn:disabled { opacity: .6; cursor: default; }
    .clock { text-align: center; margin: 4px 0 20px; }
    .clock .h { font-family: var(--font-title); font-size: 46px; font-weight: 800; color: #1e2f45; line-height: 1; letter-spacing: .02em; }
    .clock .d { font-size: 13px; color: #8a7052; margin-top: 6px; text-transform: capitalize; }
    .result { margin-top: 18px; border-radius: 14px; padding: 16px 18px; text-align: center; font-weight: 700; display: none; animation: fadeUp .3s ease both; }
    .result.ok { background: rgba(22, 163, 74, .12); border: 1px solid rgba(22, 163, 74, .35); color: var(--color-success-text); }
    .result.err { background: rgba(220, 38, 38, .1); border: 1px solid rgba(220, 38, 38, .32); color: var(--color-danger-text); }
    .hello { text-align: center; margin-bottom: 4px; }
    .hello .n { font-size: 20px; font-weight: 800; color: #1e2f45; }
    .hello .s { font-size: 12px; color: #8a7052; }
    .foot { text-align: center; margin-top: 22px; }
    .link-btn { background: none; border: none; color: #8a7052; font-size: 13px; text-decoration: underline; cursor: pointer; }
    .spin { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Notificación de resultado del fichaje (pantalla completa) ── */
    .notif-ov { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(30, 47, 69, .5); backdrop-filter: blur(5px); animation: notifFade .2s ease both; }
    .notif-card { background: #fff; border-radius: 26px; max-width: 380px; width: 100%; overflow: hidden; text-align: center; padding: 0 26px 26px; box-shadow: 0 26px 64px rgba(30, 47, 69, .3); animation: notifPop .32s cubic-bezier(.2, .8, .3, 1.25) both; }
    .notif-band { height: 9px; margin: 0 -26px 22px; }
    .notif-card.ok .notif-band { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .notif-card.err .notif-band { background: linear-gradient(90deg, #dc2626, #f87171); }
    .notif-ic { width: 82px; height: 82px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 6px auto 16px; }
    .notif-card.ok .notif-ic { background: rgba(22, 163, 74, .12); color: #15803d; }
    .notif-card.err .notif-ic { background: rgba(220, 38, 38, .1); color: #b91c1c; }
    .notif-ic svg { width: 46px; height: 46px; }
    .notif-title { font-family: var(--font-title); font-size: 24px; font-weight: 800; color: #1e2f45; line-height: 1.14; }
    .notif-msg { font-size: 15px; color: #5b6b80; margin-top: 9px; line-height: 1.45; }
    .notif-det { margin-top: 16px; padding-top: 15px; border-top: 1px dashed rgba(30, 47, 69, .15); font-size: 16px; color: #1e2f45; font-weight: 800; }
    .notif-det .sub { font-size: 14px; color: #5b6b80; font-weight: 600; margin-top: 3px; }
    .notif-btn { margin-top: 22px; width: 100%; min-height: 52px; border: none; border-radius: 15px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; font-family: var(--font-title); }
    .notif-card.ok .notif-btn { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .notif-card.err .notif-btn { background: linear-gradient(135deg, #2c6eb4, #5a97d4); }
    @keyframes notifFade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes notifPop { from { opacity: 0; transform: scale(.9) translateY(12px) } to { opacity: 1; transform: none } }
  </style>
</head>

<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="wrap">

    <div class="logo">
      <img src="img/one-logocolor.png" alt="OSYC" onerror="this.style.display='none'" />
    </div>

    <!-- ══ LOGIN ══ -->
    <div id="vLogin" class="card" style="display:none;">
      <h2 style="font-size:19px;font-weight:800;text-align:center;margin-bottom:4px;">Ingresá para fichar</h2>
      <p style="font-size:13px;color:#8a7052;text-align:center;margin-bottom:18px;">Con tu email y tu DNI</p>
      <div style="margin-bottom:12px;">
        <label class="lbl">Email</label>
        <input class="inp" type="email" id="fEmail" autocomplete="username" placeholder="tuemail@osyc.com"
          onkeydown="if(event.key==='Enter')document.getElementById('fPass').focus()" />
      </div>
      <div style="margin-bottom:18px;">
        <label class="lbl">DNI</label>
        <input class="inp" type="password" id="fPass" inputmode="numeric" autocomplete="current-password" placeholder="Tu DNI (sin puntos)"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;min-height:50px;font-size:16px;" id="btnLogin" onclick="doLogin()">Ingresar →</button>
      <div id="loginErr" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:var(--color-danger-text);font-weight:700;"></div>
    </div>

    <!-- ══ FICHAJE ══ -->
    <div id="vFichar" style="display:none;">
      <div class="hello">
        <div class="n" id="empNombre">—</div>
        <div class="s">Listo para fichar</div>
      </div>
      <div class="card" style="margin-top:16px;">
        <div class="clock">
          <div class="h" id="clkH">--:--</div>
          <div class="d" id="clkD">—</div>
        </div>
        <button class="fichar-btn" id="btnFichar" onclick="doFichar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Fichar</button>
        <div id="fResult" class="result"></div>
      </div>
      <div class="foot">
        <button class="link-btn" onclick="doLogout()">Cerrar sesión</button>
      </div>
    </div>

    <div id="vLoading" style="text-align:center;padding:40px;color:#8a7052;">Cargando…</div>

  </div>

  <!-- ══ NOTIFICACIÓN DE RESULTADO ══ -->
  <div id="notif" class="notif-ov" style="display:none;" onclick="if(event.target===this)closeNotif()">
    <div class="notif-card" id="notifCard">
      <div class="notif-band"></div>
      <div class="notif-ic" id="notifIc"></div>
      <div class="notif-title" id="notifTitle"></div>
      <div class="notif-msg" id="notifMsg"></div>
      <div class="notif-det" id="notifDet" style="display:none;"></div>
      <button class="notif-btn" id="notifBtn" onclick="closeNotif()">Listo</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=8"></script>
  <script>
    // Si el QR de la sucursal trae ?sede=<id>, se ficha contra esa sede; si no, se autodetecta por GPS.
    const _sedeParam = new URLSearchParams(location.search).get('sede') || null;
    const _DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const _MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function _show(v) {
      ['vLogin','vFichar','vLoading'].forEach(id => document.getElementById(id).style.display = id === v ? '' : 'none');
    }

    function _tickClock() {
      const d = new Date();
      const el = document.getElementById('clkH');
      if (el) el.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const ed = document.getElementById('clkD');
      if (ed) ed.textContent = `${_DIAS[d.getDay()]} ${d.getDate()} de ${_MESES[d.getMonth()]}`;
    }
    setInterval(_tickClock, 1000);

    async function init() {
      _show('vLoading');
      const { data: { session } } = await SB.auth.getSession();
      if (session) enterFichaje(session);
      else _show('vLogin');
    }

    function enterFichaje(session) {
      const nombre = session.user?.user_metadata?.nombre || session.user?.email || 'Empleado';
      document.getElementById('empNombre').textContent = 'Hola, ' + nombre + ' ';
      _tickClock();
      _show('vFichar');
    }

    async function doLogin() {
      const email = document.getElementById('fEmail').value.trim().toLowerCase();
      const dni = document.getElementById('fPass').value.trim();
      const err = document.getElementById('loginErr');
      err.style.display = 'none';
      if (!email || !dni) { err.textContent = 'Completá email y DNI'; err.style.display = ''; return; }
      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Ingresando…';
      const { data, error } = await SB.auth.signInWithPassword({ email, password: dni });
      btn.disabled = false; btn.textContent = 'Ingresar →';
      if (error || !data?.session) { err.textContent = 'Email o DNI incorrectos'; err.style.display = ''; return; }
      enterFichaje(data.session);
    }

    async function doLogout() {
      try { await SB.auth.signOut(); } catch (_) {}
      document.getElementById('fEmail').value = '';
      document.getElementById('fPass').value = '';
      _show('vLogin');
    }

    function _result(ok, msg) {
      const r = document.getElementById('fResult');
      r.className = 'result ' + (ok ? 'ok' : 'err');
      r.innerHTML = msg;
      r.style.display = '';
    }

    // Notificación grande de resultado (éxito / error) con vibración
    let _notifTimer = null;
    const _NOTIF_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const _NOTIF_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    function closeNotif() {
      document.getElementById('notif').style.display = 'none';
      if (_notifTimer) { clearTimeout(_notifTimer); _notifTimer = null; }
    }
    function _notify(ok, o) {
      o = o || {};
      const card = document.getElementById('notifCard');
      card.className = 'notif-card ' + (ok ? 'ok' : 'err');
      document.getElementById('notifIc').innerHTML = ok ? _NOTIF_CHECK : _NOTIF_ALERT;
      document.getElementById('notifTitle').textContent = o.title || (ok ? 'Listo' : 'No se pudo fichar');
      const msgEl = document.getElementById('notifMsg');
      msgEl.textContent = o.msg || '';
      msgEl.style.display = o.msg ? '' : 'none';
      const det = document.getElementById('notifDet');
      if (o.det) { det.innerHTML = o.det; det.style.display = ''; } else { det.style.display = 'none'; }
      document.getElementById('notifBtn').textContent = ok ? 'Listo' : 'Entendido';
      document.getElementById('notif').style.display = '';
      try { if (navigator.vibrate) navigator.vibrate(ok ? 90 : [70, 60, 70]); } catch (_) {}
      if (_notifTimer) clearTimeout(_notifTimer);
      if (ok) _notifTimer = setTimeout(closeNotif, 5000);   // el éxito se cierra solo
    }
    // texto seguro dentro de HTML (para nombre/sede que vienen de la base)
    function _esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function doFichar() {
      const btn = document.getElementById('btnFichar');
      const r = document.getElementById('fResult');
      r.style.display = 'none';
      if (!navigator.geolocation) { _notify(false, { title: 'No se pudo fichar', msg: 'Tu teléfono no permite acceder a la ubicación. Activá el GPS y probá de nuevo.' }); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Ubicando…';

      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        btn.innerHTML = '<span class="spin"></span> Registrando…';
        const { data, error } = await SB.rpc('fichar', {
          p_sede_id: _sedeParam, p_lat: latitude, p_lng: longitude, p_accuracy: accuracy, p_tipo: null
        });
        btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Fichar';
        if (error) {
          console.error('fichar RPC error:', error);
          _notify(false, { title: 'No se pudo fichar', msg: 'Hubo un problema de conexión. Esperá unos segundos y probá otra vez.' });
          return;
        }
        if (data?.ok) {
          const esEnt = data.tipo === 'entrada';
          _notify(true, {
            title: esEnt ? '¡Ingreso registrado!' : '¡Salida registrada!',
            msg: esEnt ? 'Tu ingreso quedó fichado correctamente.' : 'Tu salida quedó fichada correctamente.',
            det: (data.nombre ? _esc(data.nombre) : '')
              + '<div class="sub">' + _esc(data.sede || '') + (data.hora ? ' · ' + _esc(data.hora) : '') + '</div>'
          });
        } else {
          _notify(false, { title: 'No se pudo fichar', msg: data?.msg || 'No se pudo registrar el fichaje. Probá de nuevo.' });
        }
      }, err => {
        btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Fichar';
        const msg = err.code === 1
          ? 'Necesitás permitir la ubicación para fichar. Activala y probá de nuevo.'
          : 'No pudimos obtener tu ubicación. Salí a un lugar más abierto y reintentá.';
        _notify(false, { title: 'No se pudo fichar', msg: msg });
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Busca si hay una versión nueva publicada
        reg.update();
        setInterval(() => reg.update(), 60 * 60 * 1000);   // y revisa cada 1 h si la app queda abierta
        reg.addEventListener('updatefound', () => {
          const nuevo = reg.installing;
          if (!nuevo) return;
          nuevo.addEventListener('statechange', () => {
            // Nueva versión lista Y ya había una controlando la página → recargar
            if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      }).catch(() => {});
    }
    init();
  </script>
</body>

</html>
